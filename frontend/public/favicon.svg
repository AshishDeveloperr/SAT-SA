<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCA5A5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Dark Slate Outer Ring for Contrast on any tab bar -->
  <rect width="32" height="32" rx="7" fill="#0F172A" />

  <!-- Shield Shape -->
  <path 
    d="M16 4L6 8.5V15C6 21.2 10.3 26.9 16 28.5C21.7 26.9 26 21.2 26 15V8.5L16 4Z" 
    fill="url(#shieldGrad)" 
    stroke="#EF4444" 
    stroke-width="1.2"
  />

  <!-- Inner Cyber Core / Radar Reticle -->
  <circle cx="16" cy="15.5" r="4.5" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="2 1.5" />
  <circle cx="16" cy="15.5" r="2" fill="#FFFFFF" />

  <!-- Supervisory Node Pulses -->
  <circle cx="16" cy="10" r="1" fill="#FEF08A" />
  <circle cx="11.5" cy="17.5" r="1" fill="#FEF08A" />
  <circle cx="20.5" cy="17.5" r="1" fill="#FEF08A" />
</svg>
