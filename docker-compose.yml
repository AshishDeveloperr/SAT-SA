version: '3.8'

services:
  # 1. Reverse Proxy & Static Asset Gateway
  gateway:
    image: nginx:alpine
    container_name: satsa-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - satsa-network

  # 2. SAT-SA Backend Supervisory Analytics API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: satsa-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - DB_CLIENT=pg
      - DATABASE_URL=postgres://satsa:satsa_secure_2026@db:5432/satsa_db
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - satsa-network

  # 3. PostgreSQL Database (Offline Fact & Rule Registry)
  db:
    image: postgres:16-alpine
    container_name: satsa-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=satsa
      - POSTGRES_PASSWORD=satsa_secure_2026
      - POSTGRES_DB=satsa_db
    volumes:
      - satsa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satsa -d satsa_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - satsa-network

networks:
  satsa-network:
    internal: false # set to true in strictly isolated air-gap host

volumes:
  satsa-pgdata:
